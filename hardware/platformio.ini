[env]
platform = espressif32@7.0.1
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
lib_deps = sandeepmistry/LoRa@0.8.0
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1

[env:gps_tx]
build_flags = ${env.build_flags} -DSH_GPS_TX=1

[env:base_rx]
build_flags = ${env.build_flags} -DSH_BASE_RX=1
